<style>
:root{--void:#0b0410;--ink:#f6efe2;--dim:#b4a68f;--gold:#ffc83d}
html{background:var(--void)}
/* A block un-hides its optional parts by removing [hidden]; its own display rules must not
   out-rank the attribute, or an empty 'Hand of the night' pill shows on a story-less night. */
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--ink);
  font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
/* The typeface reaches into every block. The blocks set their own family on their root id, so
   the override needs more weight than one id: html body #id beats #id. */
html body #fpl-board, html body #fpl-schedule, html body #fpl-results, html body #fpl-venues,
html body #fpl-home{font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* The display face on every big title: the neon glow the blocks already paint, in a marquee
   letterform instead of a heavy sans. */
html body #fpl-board .fpl-title, html body #fpl-schedule .fpl-h1, html body #fpl-results .fpl-h1,
html body #fpl-venues .fpl-h1, html body #fpl-home .hm-title, .site-brand{
  font-family:"Bebas Neue","Inter",Impact,sans-serif;font-weight:400;letter-spacing:.06em}
html body #fpl-board .fpl-title, html body #fpl-schedule .fpl-h1, html body #fpl-results .fpl-h1,
html body #fpl-venues .fpl-h1{font-size:clamp(2.4rem,8vw,3.6rem);line-height:1}
html body #fpl-home .hm-title{font-size:clamp(3rem,11vw,5.6rem)}
.site-head{border-bottom:1px solid rgba(255,255,255,.08)}
.site-bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap}
.site-brand{color:var(--ink);text-decoration:none;font-size:1.55rem;white-space:nowrap;line-height:1}
.site-brand .spade{color:var(--gold);margin-right:6px}
.site-nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.site-nav a{color:var(--dim);text-decoration:none;padding:8px 12px;border-radius:999px;
  font-size:.95rem;line-height:1.2;font-weight:600}
.site-nav a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.site-nav a[aria-current="page"]{color:var(--void);background:var(--gold);font-weight:700}
.site-main{max-width:1040px;margin:0 auto;padding:16px 16px 40px}
.site-404{text-align:center;padding:64px 16px}
.site-404 h1{font-size:1.6rem;margin:0 0 12px}
.site-404 a{color:var(--gold)}
@media (max-width:600px){
  .site-bar{padding:8px 12px;gap:8px}
  .site-brand{font-size:1.35rem}
  /* Five items do not fit a phone in one row at the desktop size; a single scrollable row
     beats a second line, which pushed the page down and read as a broken header. */
  .site-nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .site-nav::-webkit-scrollbar{display:none}
  .site-nav a{padding:8px 9px;font-size:.84rem;white-space:nowrap}
  .site-main{padding:12px 12px 28px}
}
</style>
</head>
<body>
<header class="site-head">
  <div class="site-bar">
    <a class="site-brand" href="/"><span class="spade">&spades;</span>Falcon Poker League</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/">Home</a>
      <a href="/leaderboard/" aria-current="page">Leaderboard</a>
      <a href="/schedule/">Schedule</a>
      <a href="/results/">Recent games</a>
      <a href="/venues/">Venues</a>
    </nav>
  </div>
</header>
<main class="site-main">
<!--
  FPL LEADERBOARD — paste-once embed for the owner's GoDaddy "Websites + Marketing" site.

  HOW IT WORKS
    This whole block lives in HIS site (Add Section -> HTML). The markup and styling are
    stored there permanently; only the NUMBERS come from us, fetched from FEED below each
    time somebody loads the page. So it is his page, on his domain, in his nav — nothing is
    linked out to, and no iframe is involved. He pastes it once and never touches it again;
    the standings refresh themselves every night.

  IF THE DESIGN EVER CHANGES he needs a fresh copy of this block. Data changes need nothing.

  REQUIREMENTS ON OUR SIDE
    * FEED must be reachable WITHOUT Cloudflare Access, or his visitors hit a sign-in wall.
    * FEED must send Access-Control-Allow-Origin (web/app.py /board.json already does).

  SAFETY NOTES FOR EDITING
    * Every class is prefixed `fpl-` and every rule is scoped under #fpl-board, so this block
      cannot restyle the rest of his site — and his site's CSS is unlikely to reach in here.
    * No external fonts, scripts or images: GoDaddy's HTML section is sandboxed and a CDN
      reference is the usual reason an embed renders bare.
    * Degrades honestly: if the feed is unreachable it says so rather than showing an empty
      board that reads as "nobody has any points".
-->
<div id="fpl-board" data-tiers="1" data-feed="https://app.falconpokerleague.com/board.json"
     data-collapse="10" data-collapse-wide="20">
  <div class="fpl-shell">
    <header class="fpl-head">
      <h2 class="fpl-title">Falcon Poker League</h2>
      <p class="fpl-sub" id="fpl-sub">Loading the standings&hellip;</p>
    </header>

    <button class="fpl-hand" id="fpl-hand" type="button" hidden>
      <span class="fpl-tag">Hand of the night</span>
      <span class="fpl-hh" id="fpl-hh"></span>
      <span class="fpl-go" aria-hidden="true">&rarr;</span>
    </button>

    <p class="fpl-hint" id="fpl-hint" hidden>Tap any card to turn it over.</p>

    <div class="fpl-find" id="fpl-find" hidden>
      <label class="fpl-vh" for="fpl-q">Find a player by name</label>
      <input class="fpl-q" id="fpl-q" type="search" autocomplete="off"
             placeholder="Find your name&hellip;">
    </div>
    <p class="fpl-count" id="fpl-count" role="status" aria-live="polite" hidden></p>

    <ol class="fpl-deal" id="fpl-deal"></ol>
    <p class="fpl-morewrap"><button class="fpl-more" id="fpl-more" type="button" hidden></button></p>

    <p class="fpl-note" id="fpl-note" hidden></p>
    <footer class="fpl-foot" id="fpl-foot" hidden></footer>
  </div>
</div>

<style>
#fpl-board{
  --fpl-void:#0b0410; --fpl-ink:#f6efe2; --fpl-dim:#b4a68f;
  --fpl-pink:#ff2d95; --fpl-cyan:#26e6f5; --fpl-gold:#ffc83d;
  /* WHICH tier a player is in comes from the engine, so it can never drift from the posted
     board. The SHADES are this block's own, because the board's are chosen for black ink on
     white paper (#1e46c8, #0369a1) and would be unreadable as chips on a near-black panel.
     These are bright enough to carry the dark chip text, and separated by hue rather than
     lightness so the two blue-ish tiers stay distinguishable. t5 (the Finals alternates, added
     2026-08-29) is numbered last because the payload appends it last — see web/data.py — but it
     RANKS second, and the violet keeps it clear of both blues on the same hue argument. */
  --fpl-t1:#22c55e; --fpl-t2:#3b82f6; --fpl-t3:#22d3ee; --fpl-t4:#f87171; --fpl-t5:#a78bfa;
  background:radial-gradient(1200px 600px at 20% -10%, #2a0b33 0%, transparent 60%),
             radial-gradient(900px 500px at 90% 10%, #06303a 0%, transparent 55%),
             var(--fpl-void);
  color:var(--fpl-ink);
  padding:26px 14px 34px;
  border-radius:16px;
  font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  line-height:1.45;
  /* Contain the glow so it cannot bleed over his site's own sections. */
  overflow:hidden;
}
#fpl-board *{box-sizing:border-box}
#fpl-board .fpl-shell{max-width:1000px;margin:0 auto}

#fpl-board .fpl-head{text-align:center;margin:0 0 6px}
#fpl-board .fpl-title{
  margin:0;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;letter-spacing:.02em;
  color:#fff;text-shadow:0 0 12px rgba(255,45,149,.75),0 0 34px rgba(255,45,149,.35);
}
#fpl-board .fpl-sub{margin:6px 0 0;color:var(--fpl-gold);font-size:.95rem;letter-spacing:.06em}
#fpl-board .fpl-hint{margin:14px 0 10px;text-align:center;color:var(--fpl-dim);font-size:.86rem}
#fpl-board .fpl-note{
  margin:18px auto 0;max-width:520px;text-align:center;color:var(--fpl-ink);
  background:rgba(255,45,149,.10);border:1px solid rgba(255,45,149,.45);
  border-radius:12px;padding:14px 16px;font-size:.92rem;
}
#fpl-board .fpl-foot{margin:22px 0 0;text-align:center;color:var(--fpl-dim);font-size:.82rem}

/* align-items:start so a flipped card grows on its own — without it the taller card stretches
   its whole grid row and the untouched neighbor grows to match, which reads as a layout bug. */
/* ---- hand of the night ----
   ⚠️ A ONE-LINE TEASER, and the story itself lives in a fixed overlay. It used to render inline,
   which made the panel the single biggest source of height variance on this block: ~410px, and
   swinging with the story's LENGTH and the viewport width, because prose wraps to roughly twice
   as many lines at 390px as at 1280px. Measured 2026-08-02 with a real 106-word story it took
   the block to 1596 desktop / 1782 mobile — 186px apart and CLIPPING the 1700px section on a
   phone. As a teaser the block measures the same with a story as without, and the section drops
   well below the old value. The headline is clamped to a single line for the same reason: a
   two-line headline on a phone would put the variance straight back.
   Recent games solves the identical problem the identical way (web/templates/frag_results.html). */
#fpl-board .fpl-hand{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  margin:18px 0 20px;padding:14px 18px;border-radius:14px;cursor:pointer;font:inherit;
  background:linear-gradient(160deg,#220d2a,#12061a);
  border:2px solid var(--fpl-pink);
  box-shadow:0 0 40px rgba(255,45,149,.25), inset 0 0 60px rgba(255,45,149,.06);
}
#fpl-board .fpl-hand:hover{border-color:#ff5aae}
#fpl-board .fpl-tag{
  flex:none;font-weight:700;font-size:.7rem;letter-spacing:.22em;
  text-transform:uppercase;color:#06030a;background:var(--fpl-gold);
  padding:6px 12px;border-radius:999px;
}
#fpl-board .fpl-hand .fpl-hh{
  flex:1 1 auto;min-width:0;margin:0;font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;
  color:#fff;text-shadow:0 0 18px rgba(255,45,149,.7);
  /* one line, always — see the note above */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#fpl-board .fpl-go{flex:none;color:var(--fpl-pink);font-weight:800}
/* On a phone the tag and the headline stack badly side by side; hide the tag and let the
   headline carry it. Still exactly one line either way. */
@media (max-width:520px){
  #fpl-board .fpl-tag{display:none}
}

/* ---- the story overlay ----
   ⚠️ ABSOLUTE, not FIXED — see the matching note in web/templates/frag_results.html. Inside a
   GoDaddy section the block lives in an iframe whose box is the whole hand-set section, so
   `position:fixed` resolves against that rather than the visible window and the panel lands
   hundreds of pixels away from what was tapped. Out of flow either way, so it still costs the
   block no height. Anchored under the teaser, which is near the top of the block. */
#fpl-board{position:relative}
#fpl-board .fpl-veil{
  position:absolute;inset:0;z-index:2147483000;background:rgba(4,2,8,.84);
}
#fpl-board .fpl-veil[hidden]{display:none}
#fpl-board .fpl-panel{
  position:absolute;left:50%;transform:translateX(-50%);
  width:min(640px,calc(100% - 28px));max-height:calc(100% - 24px);overflow:auto;
  padding:24px 22px 26px;border-radius:18px;text-align:left;
  background:linear-gradient(160deg,#220d2a,#12061a);
  border:2px solid var(--fpl-pink);
  box-shadow:0 24px 70px rgba(0,0,0,.65), inset 0 0 60px rgba(255,45,149,.06);
}
/* ⚠️ `fpl-sshut`, NOT `fpl-shut` — the card back's "Turn back" button has owned that name since
   July, and this rule sits EARLIER in the stylesheet. Sharing it made every flipped card's
   "Turn back" a 32px circle with the text clipped: the properties declared only here
   (position/top/right/width/height) leaked down into it, while the later rule's
   border-radius:999px turned that 32×32 box into a circle. Same name as the Recent-games
   overlay's `sshut` so the two close buttons read as the same thing. */
#fpl-board .fpl-sshut{
  position:absolute;top:10px;right:12px;width:32px;height:32px;
  background:none;border:0;color:var(--fpl-dim);font-size:1.5rem;line-height:1;cursor:pointer;
  border-radius:8px;
}
#fpl-board .fpl-sshut:hover{color:#fff;background:rgba(255,255,255,.08)}
#fpl-board .fpl-pcs{display:flex;gap:9px;margin:15px 0 14px;flex-wrap:wrap}
#fpl-board .fpl-pc{
  width:52px;height:74px;border-radius:8px;background:#fffdf6;color:#17110d;
  display:grid;place-items:center;font:700 1.5rem/1 Georgia,"Times New Roman",serif;
  box-shadow:0 6px 18px rgba(0,0,0,.5);animation:fpl-flip .7s cubic-bezier(.2,.8,.3,1) both;
}
#fpl-board .fpl-pc.fpl-red{color:#c0182f}
/* A hole card named inside the prose, drawn small and inline. Baseline-aligned with no
   line-height change: this panel lives inside a section whose height the owner hand-sets. */
#fpl-board .fpl-ic{
  display:inline-block;min-width:15px;padding:1px 4px;margin:0 1px;border-radius:3px;
  background:#fffdf6;color:#17110d;font:700 .82em/1.15 Georgia,"Times New Roman",serif;
  vertical-align:baseline;
}
#fpl-board .fpl-ic.fpl-red{color:#c0182f}
@keyframes fpl-flip{
  from{transform:rotateY(90deg) translateY(-14px);opacity:0}
  to{transform:none;opacity:1}
}
#fpl-board .fpl-panel .fpl-hh{
  margin:6px 34px 10px 0;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:800;color:#fff;
  text-shadow:0 0 18px rgba(255,45,149,.7);
}
#fpl-board .fpl-panel p{margin:0 0 9px;color:#e7dcc8}
#fpl-board .fpl-fine{
  margin-top:14px !important;font-size:.72rem;color:var(--fpl-dim);font-style:italic;
}
@media (prefers-reduced-motion: reduce){
  #fpl-board .fpl-pc{animation:none}
}

#fpl-board .fpl-deal{list-style:none;margin:0;padding:0;display:grid;gap:12px;align-items:start}
@media (min-width:760px){ #fpl-board .fpl-deal{grid-template-columns:1fr 1fr} }
/* An explicit rule, not a reliance on the `hidden` attribute's default: `hidden` sets
   display:none at the UA level, which ANY later display declaration would beat. */
#fpl-board .fpl-seat[hidden]{display:none}
/* Tier headers, site only (data-tiers="1"): full-width rows in the two-column grid. */
#fpl-board .fpl-group{grid-column:1/-1;margin:14px 0 0;padding:0 2px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
#fpl-board .fpl-group:first-child{margin-top:0}
#fpl-board .fpl-group h3{margin:0;font-size:.82rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--fpl-cc)}
#fpl-board .fpl-group span{display:block;margin-top:2px;color:var(--fpl-dim);font-size:.84rem}
#fpl-board .fpl-group[hidden]{display:none}

/* ---- find a player ----
   Only the top 10 show by default, and the league is 80 deep. Without a search, the one
   question every single player opens this page to answer — "where am I?" — takes an expand
   and a scroll on a phone. */
#fpl-board .fpl-find{margin:14px auto 0;max-width:420px}
#fpl-board .fpl-q{
  width:100%;padding:11px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);
  color:var(--fpl-ink);font:inherit;font-size:.95rem;
}
#fpl-board .fpl-q::placeholder{color:var(--fpl-dim)}
#fpl-board .fpl-q:focus{
  outline:none;border-color:var(--fpl-cyan);box-shadow:0 0 0 3px rgba(38,230,245,.25);
}
#fpl-board .fpl-count{margin:10px 0 0;text-align:center;color:var(--fpl-dim);font-size:.85rem}
/* Off-screen rather than display:none — a screen reader still needs to announce the label. */
#fpl-board .fpl-vh{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

/* ---- collapse control ---- */
#fpl-board .fpl-morewrap{margin:18px 0 0;text-align:center}
#fpl-board .fpl-more{
  background:none;border:1px solid var(--fpl-cyan);color:var(--fpl-cyan);
  border-radius:999px;padding:10px 22px;font:inherit;font-size:.9rem;font-weight:700;
  letter-spacing:.04em;cursor:pointer;
}
#fpl-board .fpl-more:hover{background:var(--fpl-cyan);color:#04222a}
#fpl-board .fpl-more:focus-visible{outline:3px solid var(--fpl-cyan);outline-offset:3px}

#fpl-board .fpl-seat{perspective:1200px}
#fpl-board .fpl-card{position:relative;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.8,.3,1), min-height .35s ease}
#fpl-board .fpl-seat.fpl-open .fpl-card{transform:rotateY(180deg)}

/* The back is absolutely positioned, so it inherits the FRONT's height — and the front is a
   compact one-line row while the back carries six stats and the venue pips. Without this the
   flipped card is clipped just below its heading.
   MEASURED, not guessed: the worst case (Leslie R — longest name, all six venue pips) needs
   213px wide / 241px narrow, so these carry ~15% headroom for a longer name or an extra venue.
   Re-measure with scripts/shoot_embed.py if the back gains a row. The back keeps overflow:auto
   as a last-resort safety net. Moving "Turn back" up onto the name line (2026-07-28) took a
   whole row out of the back, which is why these are lower than the 250/300 they replaced. */
#fpl-board .fpl-seat.fpl-open .fpl-card{min-height:245px}
@media (max-width:759px){ #fpl-board .fpl-seat.fpl-open .fpl-card{min-height:275px} }

#fpl-board .fpl-face{
  border-radius:14px;border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#fpl-board .fpl-front{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:13px 15px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;
  border-left:4px solid var(--fpl-cc);
}
#fpl-board .fpl-front:hover{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03))}
#fpl-board .fpl-front:focus-visible{outline:3px solid var(--fpl-cyan);outline-offset:2px}
#fpl-board .fpl-back{
  position:absolute;inset:0;transform:rotateY(180deg);
  padding:13px 15px;display:flex;flex-direction:column;gap:9px;overflow:auto;
}

#fpl-board .fpl-chip{
  width:40px;height:40px;border-radius:50%;display:block;text-align:center;position:relative;
  font-weight:800;font-size:1rem;color:#06030a;font-variant-numeric:tabular-nums;
  /* One full-height line box + .7px top padding (not grid centering): the digit's baseline snaps
     to whole pixels; this is the middle of the band that measured centered (2026-10-17). */
  line-height:39.3px;padding:.7px 0 0;
  /* A poker chip: the tier color is the face, eight pale edge spots ring it (a repeating conic
     gradient under a radial face), a thin inner ring in the pseudo-element below. */
  background:
    radial-gradient(circle, var(--fpl-cc) 0 58%, transparent 59%),
    repeating-conic-gradient(from -11.25deg, #fff 0 22.5deg, var(--fpl-cc) 22.5deg 45deg);
  box-shadow:0 0 14px color-mix(in srgb, var(--fpl-cc) 55%, transparent), inset 0 0 0 1px rgba(0,0,0,.25);
}
#fpl-board .fpl-chip::after{
  content:"";position:absolute;inset:18%;border-radius:50%;border:1px solid rgba(0,0,0,.28);pointer-events:none;
}
#fpl-board .fpl-who{min-width:0}
#fpl-board .fpl-nm{margin:0;font-weight:700;font-size:1.05rem;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fpl-board .fpl-tier{margin:1px 0 0;font-size:.76rem;color:var(--fpl-dim)}
#fpl-board .fpl-score{text-align:right}
#fpl-board .fpl-n{font-weight:800;font-size:1.05rem;color:var(--fpl-gold);
  font-variant-numeric:tabular-nums}
#fpl-board .fpl-lbl{font-size:.68rem;color:var(--fpl-dim);text-transform:uppercase;
  letter-spacing:.13em}

/* Name, points and the way out share the card back's top line. 1fr/auto/1fr rather than
   auto/1fr/auto so the points sit at the TRUE center of the card, independent of how long the
   name or the button happens to be. */
#fpl-board .fpl-btop{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:0 0 2px;
}
#fpl-board .fpl-bt{
  margin:0;font-weight:800;color:#fff;font-size:1.02rem;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#fpl-board .fpl-bpts{
  font-weight:800;color:var(--fpl-gold);font-size:1.02rem;text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
#fpl-board .fpl-recs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0}
#fpl-board .fpl-recs>div{background:rgba(0,0,0,.28);border-radius:9px;padding:7px 8px}
#fpl-board .fpl-recs dt{font-size:.64rem;color:var(--fpl-dim);text-transform:uppercase;
  letter-spacing:.1em}
/* An acronym's plural 's' must not be capitalised: the label is FPCs, and uppercasing it
   gives "FPCS", which reads as a four-letter acronym rather than a count of chips. */
#fpl-board .fpl-recs dt.fpl-asis{text-transform:none}
#fpl-board .fpl-recs dd{margin:2px 0 0;font-weight:700;color:var(--fpl-ink);
  font-variant-numeric:tabular-nums;font-size:.95rem}
#fpl-board .fpl-vrow{display:flex;flex-wrap:wrap;gap:5px}
#fpl-board .fpl-vp{
  font-size:.68rem;padding:3px 8px;border-radius:999px;
  border:1px solid rgba(255,255,255,.18);color:var(--fpl-dim);
}
#fpl-board .fpl-vp.fpl-on{background:var(--fpl-cyan);border-color:var(--fpl-cyan);
  color:#04222a;font-weight:700}
/* Lives on the top line beside the name, not under the stats — that removed a whole row from
   the card's height, and it also put the way out where a reader looks for it first. */
#fpl-board .fpl-shut{
  justify-self:end;white-space:nowrap;background:none;border:1px solid rgba(255,255,255,.28);
  color:var(--fpl-ink);border-radius:999px;padding:5px 13px;font:inherit;font-size:.78rem;
  cursor:pointer;
}
#fpl-board .fpl-shut:hover{border-color:var(--fpl-cyan);color:var(--fpl-cyan)}

/* The flip is decoration. Turned off, both faces simply stack and stay readable. */
@media (prefers-reduced-motion:reduce){
  #fpl-board .fpl-card{transition:none}
  #fpl-board .fpl-seat.fpl-open .fpl-card{transform:none}
  #fpl-board .fpl-face{backface-visibility:visible;-webkit-backface-visibility:visible}
  #fpl-board .fpl-back{position:relative;inset:auto;transform:none;
    border-top:1px solid rgba(255,255,255,.12);border-radius:0 0 14px 14px}
  #fpl-board .fpl-seat:not(.fpl-open) .fpl-back{display:none}
}
</style>

<script>
(function () {
  "use strict";

  var root = document.getElementById("fpl-board");
  if (!root) return;

  var FEED  = root.getAttribute("data-feed");
  var deal  = document.getElementById("fpl-deal");
  var sub   = document.getElementById("fpl-sub");
  var hint  = document.getElementById("fpl-hint");
  var note  = document.getElementById("fpl-note");
  var foot  = document.getElementById("fpl-foot");
  var more  = document.getElementById("fpl-more");
  var find  = document.getElementById("fpl-q");
  var count = document.getElementById("fpl-count");

  // Tier 5 is the Finals ALTERNATE. It is numbered last and ranks second — the payload appends
  // new tiers rather than renumbering, because this block lives in the owner's own site and a
  // renumber would remistate every player already on his page until he re-pastes it.
  var TIER_NAME = {
    1: "Finals qualified",
    2: "Has a top two",   // re-labeled from payload.top_finish once the feed loads (top-3 from SSN4)
    3: "Has the games in",
    4: "Still chasing",
    5: "Alternate"
  };
  // Matches --fpl-t1..t5 above. Read from the payload's tier assignment, NOT its colors —
  // see the note on the CSS variables for why the board's shades can't be reused here.
  var TIER_COLOR = { 1: "#22c55e", 2: "#3b82f6", 3: "#22d3ee", 4: "#f87171", 5: "#a78bfa" };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function num(n) { return Number(n || 0).toLocaleString("en-US"); }
  /* Hole cards named in the prose are drawn as small cards. The strip above the story is the
     five-card BOARD and nothing else — a flat row mixing board and hole gets read board-first,
     which is how G:24 shipped a picture contradicting its own words (2026-08-05) — so the hand
     itself is named in the sentence and rendered here. Rank+suit-glyph is distinctive enough to
     match safely, and every node is built with textContent, so story text is never parsed as
     HTML. Inline-block, no line-height change: this panel sits inside a hand-set section. */
  var CARD_RE = /(10|[2-9AKQJT])\s?([♠♥♦♣])/g;
  function cardedPara(text) {
    var p = el("p"), last = 0, m;
    CARD_RE.lastIndex = 0;
    while ((m = CARD_RE.exec(text)) !== null) {
      if (m.index > last) p.appendChild(document.createTextNode(text.slice(last, m.index)));
      var red = m[2] === "♥" || m[2] === "♦";
      p.appendChild(el("span", "fpl-ic" + (red ? " fpl-red" : ""), m[1] + m[2]));
      last = CARD_RE.lastIndex;
    }
    if (last < text.length) p.appendChild(document.createTextNode(text.slice(last)));
    return p;
  }

  function fail(msg) {
    sub.textContent = "";
    note.textContent = msg;
    note.hidden = false;
  }

  function build(payload) {
    var players = payload.players || [];
    var venues  = payload.venues || [];

    if (payload.empty || !players.length) {
      sub.textContent = payload.season_label || "";
      fail("The season is under way but no games have been scored yet. Standings appear here "
         + "after the first game night.");
      return;
    }

    // The qualifying finish is a season rule (top-2 through SSN3, top-3 from SSN4); the feed
    // says which, so the tier label follows it instead of the block being re-pasted per season.
    TIER_NAME[2] = "Has a top " + (payload.top_finish === 3 ? "three" : "two");
    sub.textContent = (payload.season_label || "") +
                      (payload.game_count ? "  ·  through game " + payload.game_count : "");
    hint.hidden = false;

    // The story is optional at every step — there is none until someone runs the generator,
    // and a night whose story fails validation deliberately publishes nothing. Absent, the
    // whole panel stays hidden and the board reads exactly as it did before.
    var story = payload.story;
    if (story && story.body) {
      var cue = document.getElementById("fpl-hand");
      document.getElementById("fpl-hh").textContent = story.headline || "Hand of the night";

      // The full story goes in a FIXED overlay so it costs the block no height — the teaser
      // above is a single line whether or not there is a story. See the CSS note.
      var veil = el("div", "fpl-veil");
      veil.hidden = true;
      var panel = el("div", "fpl-panel");
      var shut = el("button", "fpl-sshut", "×");
      shut.type = "button";
      shut.setAttribute("aria-label", "Close");
      panel.appendChild(shut);

      var pcs = el("div", "fpl-pcs");
      pcs.setAttribute("aria-hidden", "true");
      (story.cards || []).forEach(function (card, i) {
        var isRed = /[♥♦]/.test(card) || (i % 2 === 0);
        var el_ = el("span", "fpl-pc" + (isRed ? " fpl-red" : ""), card);
        el_.style.animationDelay = (i * 0.1) + "s";
        pcs.appendChild(el_);
      });
      panel.appendChild(pcs);
      panel.appendChild(el("h3", "fpl-hh", story.headline || "Hand of the night"));
      String(story.body).split(/\n\s*\n/).forEach(function (para) {
        if (para.trim()) panel.appendChild(cardedPara(para.trim()));
      });
      panel.appendChild(el("p", "fpl-fine",
        "Told the way it gets told in the car park. The finishing order is real; " +
        "the hand is not."));
      veil.appendChild(panel);
      root.appendChild(veil);

      function shutStory() { veil.hidden = true; cue.focus(); }
      cue.addEventListener("click", function () {
        veil.hidden = false;
        panel.style.top = "0px";
        panel.scrollTop = 0;
        // Level with the teaser, clamped inside the block. See the CSS note: fixed positioning
        // resolves against the whole GoDaddy section, not the visible window.
        var panelH = panel.offsetHeight;
        var want = cue.offsetTop || 0;
        panel.style.top = Math.max(12, Math.min(want, root.clientHeight - panelH - 12)) + "px";
        shut.focus();
      });
      shut.addEventListener("click", function (e) { e.stopPropagation(); shutStory(); });
      veil.addEventListener("click", function (e) { if (e.target === veil) shutStory(); });
      document.addEventListener("keydown", function (e) {
        if (!veil.hidden && (e.key === "Escape" || e.key === "Esc")) shutStory();
      });
      cue.hidden = false;
    }

    players.forEach(function (p, i) {
      var color = TIER_COLOR[p.tier] || TIER_COLOR[4];

      var seat = el("li", "fpl-seat");
      seat.setAttribute("data-name", String(p.name || "").toLowerCase());
      seat.setAttribute("data-tier", String(p.tier || 4));
      var card = el("div", "fpl-card");

      /* ---------- front ---------- */
      var front = el("button", "fpl-face fpl-front");
      front.type = "button";
      front.style.setProperty("--fpl-cc", color);
      front.setAttribute("aria-expanded", "false");

      var chip = el("div", "fpl-chip", String(p.rank));
      chip.style.setProperty("--fpl-cc", color);
      front.appendChild(chip);

      var who = el("div", "fpl-who");
      who.appendChild(el("p", "fpl-nm", p.name));
      who.appendChild(el("p", "fpl-tier", TIER_NAME[p.tier] || ""));
      front.appendChild(who);

      var score = el("div", "fpl-score");
      score.appendChild(el("div", "fpl-n", num(Math.round(p.total))));
      score.appendChild(el("div", "fpl-lbl", "points"));
      front.appendChild(score);

      /* ---------- back ---------- */
      var back = el("div", "fpl-face fpl-back");
      back.id = "fpl-rec-" + i;
      front.setAttribute("aria-controls", back.id);

      // Name, points and "Turn back" on one line. The points are why the card was tapped, and
      // moving the button up here costs nothing and saves a row.
      var top = el("div", "fpl-btop");
      top.appendChild(el("p", "fpl-bt", p.name));
      top.appendChild(el("div", "fpl-bpts", num(Math.round(p.total))));
      var shut = el("button", "fpl-shut", "Turn back");
      shut.type = "button";
      top.appendChild(shut);
      back.appendChild(top);

      var recs = el("dl", "fpl-recs");
      [["Games", p.games],
       ["Outlasted", num(p.outlasted)],
       ["Faced", num(p.faced)],
       ["Ratio", (Number(p.ratio || 0) * 100).toFixed(1) + "%"],
       // The qualifying finish is top-3 from SSN4 (payload.top_finish); `top2` is the field name only.
       [(payload.top_finish === 3 ? "Top threes" : "Top twos"), p.top2],
       // Third element = render the label exactly as written, bypassing the uppercase rule.
       ["FPCs", num(p.fpc), true]].forEach(function (pair) {
        var d = el("div");
        d.appendChild(el("dt", pair[2] ? "fpl-asis" : null, pair[0]));
        d.appendChild(el("dd", null, String(pair[1])));
        recs.appendChild(d);
      });
      back.appendChild(recs);

      if (venues.length) {
        var vrow = el("div", "fpl-vrow");
        venues.forEach(function (v, k) {
          vrow.appendChild(el("span", "fpl-vp" + (p.venues && p.venues[k] ? " fpl-on" : ""), v));
        });
        back.appendChild(vrow);
      }

      card.appendChild(front);
      card.appendChild(back);
      seat.appendChild(card);
      deal.appendChild(seat);

      function toggle(open) {
        seat.classList.toggle("fpl-open", open);
        front.setAttribute("aria-expanded", open ? "true" : "false");
        if (!open) front.focus();
      }
      front.addEventListener("click", function () {
        toggle(!seat.classList.contains("fpl-open"));
      });
      shut.addEventListener("click", function (e) {
        e.stopPropagation();
        toggle(false);
      });
    });

    /* ---------- collapse ----------
       The full list is several screens tall: ~3,900px on a laptop, and nearly DOUBLE that on
       a phone where the grid drops to one column. A GoDaddy HTML section has a Height set by
       hand, so no single value can be right for both — whatever fits the phone leaves a chasm
       on the laptop, and whatever fits the laptop clips the phone. Opening collapsed makes the
       natural height short and, crucially, roughly the SAME on both, so one Height works.
       It is also the design the owner picked (concept-09 opens fully collapsed).
       Expansion is in-place: no second request, no navigation, nothing to configure. */
    var seats = Array.prototype.slice.call(deal.children);
    var expanded = false;

    /* ---------- tier groups (site only: data-tiers="1") ----------
       falconpokerleague.com has no section height to respect, so it shows EVERY player and
       divides them by tier, each group headed by what that tier means under the season's
       rule. The players arrive in rank order and the ranking IS by tier, so a header goes
       in wherever the tier changes. The GoDaddy block never sets the attribute. */
    var TIERS = root.getAttribute("data-tiers") === "1";
    var groups = [];
    if (TIERS) {
      var need = payload.top_finish === 3 ? "top-three" : "top-two";
      var bar = payload.min_games || 0;
      var alt = payload.alternate_min_games;
      var WHY = {
        1: "A " + need + " finish and " + bar + "+ games. Seated at the season final.",
        5: alt ? (alt + "+ games and still no " + need + ". First in line for a seat.") : "",
        2: "Has the " + need + " finish, still short of " + bar + " games.",
        3: bar + "+ games played, still needs a " + need + " finish.",
        4: "No " + need + " finish yet."
      };
      var lastTier = null;
      seats.forEach(function (s) {
        var t = s.getAttribute("data-tier");
        if (t === lastTier) return;
        lastTier = t;
        var g = el("li", "fpl-group");
        g.style.setProperty("--fpl-cc", TIER_COLOR[t] || TIER_COLOR[4]);
        g.appendChild(el("h3", null, TIER_NAME[t] || ""));
        if (WHY[t]) g.appendChild(el("span", null, WHY[t]));
        deal.insertBefore(g, s);
        groups.push({ el: g, tier: t });
      });
    }

    /* HOW MANY TO SHOW COLLAPSED, and why it differs by screen.
       The grid is TWO columns from 760px up and one below it, so 20 cards on a wide screen and
       10 on a phone are BOTH ten rows. That keeps the collapsed height nearly the same at every
       width, which is the single thing that makes a fixed-height GoDaddy section workable —
       and it is why the phone shows fewer rather than shrinking the cards to fit more in. The
       cards stay full size and readable at every width; only the count changes. */
    var WIDE = window.matchMedia("(min-width:760px)");
    function limitNow() {
      if (TIERS) return 0;                 // grouped by tier = the whole league, always
      var narrow = parseInt(root.getAttribute("data-collapse"), 10);
      var wide = parseInt(root.getAttribute("data-collapse-wide"), 10);
      return (WIDE.matches && wide > 0) ? wide : narrow;
    }

    function refresh() {
      var limit = limitNow();
      var collapsible = limit > 0 && seats.length > limit;
      var q = (find.value || "").trim().toLowerCase();
      var hits = 0;

      seats.forEach(function (s, i) {
        var match = !q || s.getAttribute("data-name").indexOf(q) !== -1;
        if (match) hits++;
        // A SEARCH LOOKS THROUGH EVERYONE, collapsed or not. Filtering only the visible ten
        // would tell a player sitting 47th that they are not in the league — the single worst
        // answer this page could give, and the reason search is not just a CSS filter here.
        s.hidden = q ? !match : (collapsible && !expanded && i >= limit);
      });
      // A tier header with nobody visible under it (a search, or an empty tier) goes too.
      groups.forEach(function (g) {
        g.el.hidden = !seats.some(function (s) {
          return !s.hidden && s.getAttribute("data-tier") === g.tier;
        });
      });

      if (q) {
        more.hidden = true;
        count.hidden = false;
        count.textContent = hits
          ? hits + (hits === 1 ? " player" : " players") + " found."
          : "No player found matching “" + find.value.trim() + "”.";
      } else {
        count.hidden = true;
        more.hidden = !collapsible;
        if (collapsible) {
          more.textContent = expanded ? "Show top " + limit + " only"
                                      : "Show all " + seats.length + " players";
          more.setAttribute("aria-expanded", expanded ? "true" : "false");
        }
      }
    }

    if (seats.length > 1) {
      document.getElementById("fpl-find").hidden = false;
      find.addEventListener("input", refresh);
      // `search` fires on the native clear (×) in browsers that render one; without it the
      // list stays filtered after the box visibly empties.
      find.addEventListener("search", refresh);
    }
    more.setAttribute("aria-controls", "fpl-deal");
    more.addEventListener("click", function () {
      expanded = !expanded;
      refresh();
      // Collapsing from far down the list would otherwise strand the reader below the board.
      if (!expanded) root.scrollIntoView({ block: "start" });
    });

    // Rotating a phone crosses the breakpoint, which changes how many rows belong on screen.
    // addListener is the deprecated form, kept for older mobile Safari.
    if (WIDE.addEventListener) WIDE.addEventListener("change", refresh);
    else if (WIDE.addListener) WIDE.addListener(refresh);

    refresh();

    if (payload.updated) {
      foot.textContent = "Standings current as of " + payload.updated + ".";
      foot.hidden = false;
    }
  }

  try {
    fetch(FEED, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(build)
      .catch(function () {
        // Say the board is stale rather than render an empty one, which reads as
        // "everybody has zero points" and would have the owner chasing a scoring bug.
        fail("The standings could not be loaded just now. They are still being kept up to "
           + "date — please refresh in a few minutes.");
      });
  } catch (e) {
    fail("This browser could not load the standings.");
  }
})();
</script>

</main>
</body>
</html>
